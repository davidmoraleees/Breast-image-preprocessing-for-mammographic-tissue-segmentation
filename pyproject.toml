[tool.poetry]
name = "breast-preprocessing"
version = "0.1.0"
description = ""
authors = [
    "davidmoraleees <davidmoralesdeleon@gmail.com>",
    "AKuflievskaya <kuflievskaya1@gmail.com>"
]
license = "Apache-2.0"
readme = "README.md"
packages = [{ include = "breast_preprocessing", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12"
numpy = "^2.4.1"
matplotlib = "^3.10.8"
scikit-image = "^0.26.0"
tqdm = "^4.67.1"
scikit-learn = "^1.8.0"
pydicom = "^3.0.2"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
breast_preprocessing = "breast_preprocessing.main:main"
dicom_to_png = "breast_preprocessing.utils.dicom_to_png:main"
